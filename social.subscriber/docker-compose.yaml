services:

  db:
    image: 'postgres:16-alpine'
    container_name: postgres_container
    ports:
      - '5432:5432'
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
    volumes:
      - local_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: social_subscriber
    ports:
      - '8080:8080'
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - app-network

volumes:
  local_db_data:

networks:
  app-network:
    driver: bridge