services:

  db:
    image: 'postgres:16-alpine'
    container_name: postgres_container
    ports:
      - '5432:5432'
    restart: always
    environment:
      - POSTGRES_USER=${SPRING_R2DBC_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_R2DBC_PASSWORD}
    volumes:
      - local_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: social_subscriber
    ports:
      - '8080:8080'
    env_file:
      - ./.env
    networks:
      - app-network

volumes:
  local_db_data:

networks:
  app-network:
    driver: bridge